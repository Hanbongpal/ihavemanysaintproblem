<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>메이크 타임머</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
 <div class="top"><div class="title">메이크 타임머</div><button class="plus" id="add" aria-label="알람 추가">+</button></div>
 <div class="now"><div class="nowtime" id="now">00:00</div><div class="date" id="date"></div></div>
 <div class="tabs"><button class="tab active" id="alarmTab">알람</button><button class="tab" id="pomoTab">포모도로</button></div>
 <div id="main"></div>
</div>

<div class="sheetwrap" id="sheet">
 <div class="sheet">
  <h2>알람 추가</h2>
  <label>알람 시간</label>
  <input class="bigtime" id="time" type="time" value="07:00">
  <label>반복 요일</label><div class="days" id="days"></div>
  <label>알람 이름</label><input id="label" placeholder="예: 공부 시작">
  <label>알람 방식</label>
  <div class="mode"><button type="button" class="sel" id="onceMode">일반 알람</button><button type="button" id="pomoMode">포모도로 반복</button></div>
  <div class="form" id="aForm"></div>
  <div class="actions"><button class="cancel" id="cancel">취소</button><button class="save" id="save">알람 설정</button></div>
 </div>
</div>

<div class="ring" id="ring"><div class="ringbox">
 <div>⏰ 메이크 타임머</div><div class="ringtime" id="ringTime">07:00</div><div id="ringLabel"></div><div class="ringnote" id="ringNote"></div><p id="ringDetail"></p>
 <button id="stop">확인 / 알람 끄기</button>
 <div id="playerHolder"></div>
</div></div>
<div id="pomoPlayer"></div>

<script src="script.js"></script>
</body>
</html>
